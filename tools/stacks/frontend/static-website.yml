Parameters:
  StageName:
    Type: String
  AppName:
    Type: String

Resources:
  StaticWebsiteBucket:
    Type: AWS::S3::Bucket

  StaticWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticWebsiteBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Join
              - ""
              - - "arn:aws:s3:::"
                - !Ref StaticWebsiteBucket
                - "/*"
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Join
          - "Access "
          - - ""
            - !Ref StaticWebsiteBucket
            - " bucket"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AppName}-distribution-${StageName}"
        HttpVersion: http2
        Origins:
          - Id: !Ref StaticWebsiteBucket
            DomainName: !GetAtt StaticWebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: !Ref StaticWebsiteBucket
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  StaticWebsiteBucketName:
    Value: !Ref StaticWebsiteBucket
    Export:
      Name: !Sub ${AppName}-web-app-bucket-name-${StageName}
  StaticWebsiteBucketRegionalDomainName:
    Value: !GetAtt StaticWebsiteBucket.RegionalDomainName
    Export:
      Name: !Sub ${AppName}-web-app-bucket-regional-domain-name-${StageName}
  CloudFrontDistributionDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub ${AppName}-web-app-cloudfront-domain-name-${StageName}
  CloudFrontOriginAccessIdentityS3CanonicalUserId:
    Value: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
    Export:
      Name: !Sub ${AppName}-web-app-cloudfront-S3-canonical-user-id-${StageName}
